<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选课助手 · 简化方案预览</title>
<style>
:root{--bg:#fafafa;--surface:#fff;--soft:#f5f6f8;--ink:#172033;--muted:#667085;--line:#e4e7ec;--blue:#345dd2;--warn:#a65e0c;--warn-bg:#fff6e9;--chosen:#f3f6ff;color-scheme:light}html[data-theme=dark]{--bg:#11151b;--surface:#1a2028;--soft:#242b35;--ink:#e8ecf2;--muted:#a2adbb;--line:#35404d;--blue:#a8c0ff;--warn:#f1c383;--warn-bg:#3a2e1e;--chosen:#25334b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:13px/1.65 'Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:not-allowed}input:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}[hidden]{display:none!important}.layout{display:grid;grid-template-columns:68px 1fr;height:100dvh}.rail{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px}.logo{width:34px;height:34px;border-radius:50%;background:#fff}.rail nav{display:grid;gap:8px;margin-top:18px;width:100%}.rail button{padding:9px 2px;font-size:11px;border:0;background:none;width:100%;line-height:1.5}.rail button b{display:block;font-size:21px;font-weight:400}.rail .active{color:var(--blue);background:var(--chosen)}.rail-bottom{margin-top:auto;width:100%;text-align:center;color:var(--muted);font-size:9px}.rail-bottom #theme{font-size:23px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);min-height:58px}.title{display:flex;align-items:center;gap:14px}.title strong{font-size:17px}.title small{color:var(--muted);font-size:11px}.actions{display:flex;align-items:center;gap:10px}.session{border:0;color:var(--muted);font-size:12px}.session span{color:#278767}.preview-tag{font-size:10px;border-left:1px solid var(--line);padding-left:12px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:12px;padding:14px 20px}.search{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px}.search input{border:0;outline:none;min-width:0;background:none;width:100%}.search span{color:var(--muted)}.filter{font-size:12px;white-space:nowrap}.notice{margin:0 20px 12px;padding:8px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn);display:flex;align-items:center;justify-content:space-between;font-size:12px}.notice button{padding:0;background:none;border:0;color:inherit}.catalog{margin:0 20px;flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}.table-area{overflow:auto;flex:1;min-height:0}table{height:100%;border-collapse:collapse;width:100%;min-width:1440px;table-layout:fixed}th{position:sticky;top:0;z-index:1;background:var(--soft);text-align:left;font-weight:400;color:var(--muted);padding:10px 12px;font-size:11px}td{border-top:1px solid var(--line);padding:13px 12px;vertical-align:top;font-size:12px;white-space:pre-line;overflow-wrap:anywhere}th:nth-child(1){width:64px}th:nth-child(2){width:80px}th:nth-child(3){width:280px}th:nth-child(4){width:145px}th:nth-child(5){width:165px}th:nth-child(6){width:70px}th:nth-child(7){width:350px}th:nth-child(8){width:120px}th:nth-child(9){width:70px}.chosen{background:var(--chosen)}td strong{font-size:13px}td small{display:block;color:var(--muted);font-size:11px;margin-top:3px}input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue)}.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.pager-controls{display:flex;align-items:center;gap:9px}.pager button{padding:3px 8px}.pager input{width:45px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:5px}.plan-bar{margin:12px 20px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;align-items:center;gap:14px}.plan-title{white-space:nowrap;font-size:12px}.plan-chips{display:flex;flex:1;gap:8px;min-width:0;overflow:auto}.chip{white-space:nowrap;font-size:11px;padding:5px 8px;border-radius:5px;background:var(--soft);border:0}.plan-actions{display:flex;gap:8px;align-items:center;white-space:nowrap}.conflicts{color:var(--warn);background:var(--warn-bg);border-color:transparent;font-size:12px}.primary{background:var(--blue);color:#fff;border-color:transparent}.subtle{font-size:11px;color:var(--muted)}.scrim{position:fixed;inset:0;background:#0005;z-index:9}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:10;display:flex;flex-direction:column;box-shadow:-8px 0 40px #0001}.drawer-header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer-header h2{font-size:17px;margin:0}.drawer-content{padding:20px;overflow:auto}.drawer-content h3{font-size:14px;margin:18px 0 8px}.drawer-content p{color:var(--muted);margin:8px 0}.step{padding:12px 0;border-bottom:1px solid var(--line)}.step span{display:inline-block;width:24px;color:#278767}.detail-card{border:1px solid var(--line);padding:12px;margin:10px 0;border-radius:6px}.detail-card p{white-space:pre-line;font-size:12px}.drawer-content a{color:var(--blue)}@media(max-width:800px){.layout{grid-template-columns:54px 1fr}.rail{padding:10px 3px}.top{padding:10px 12px}.title small,.preview-tag{display:none}.toolbar{flex-wrap:wrap;padding:12px}.search{flex-basis:100%}.notice{margin:0 12px 10px}.catalog{margin:0 12px}.plan-bar{margin:10px 12px;flex-wrap:wrap;gap:8px}.plan-chips{flex-basis:70%}.plan-actions{width:100%;justify-content:flex-end}.pager{flex-wrap:wrap}.actions{gap:3px}.actions button{font-size:11px;padding:5px 7px}}
</style></head><body>
<div class="layout"><aside class="rail"><img class="logo" src="../assistant/static/university-logo.png" alt="校徽"><nav><button class="active" data-panel="catalog"><b>▤</b>选课</button><button data-panel="timetable"><b>▦</b>课表</button><button data-panel="results"><b>◷</b>结果</button></nav><div class="rail-bottom"><button id="theme" title="切换黑白主题">☀</button><button data-panel="about">关于</button>本地工具</div></aside>
<main class="main"><header class="top"><div class="title"><strong>选课计划</strong><small>中国石油大学（北京）克拉玛依校区</small><span class="preview-tag">设计预览 · 示例数据</span></div><div class="actions"><button class="session" data-panel="connect"><span>●</span> 教务已连接</button><button data-panel="steps">准备 3 / 7 ▾</button><button data-panel="settings" aria-label="选课设置">⚙ 设置</button></div></header>
<div class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="搜索课程、教师、教学班或模块" aria-label="搜索课程"></label><button class="filter" id="onlyChosen">仅看计划</button><button data-panel="refresh" class="filter">↻ 同步课程</button><span class="subtle" id="total"></span></div>
<div class="notice"><span id="alertText">课表有 3 门课程时间待核实</span><button data-panel="conflicts">查看问题 →</button></div>
<section class="catalog"><div class="table-area"><table><thead><tr><th>操作</th><th>选课状态</th><th>课程信息</th><th>所属课程模块</th><th>教学班</th><th>授课教师</th><th>时间地点</th><th>已选/人数上限</th><th>预选</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="range"></span><div class="pager-controls"><span id="pageSizeLabel">适应窗口</span><button id="prev">‹</button><span id="pageLabel"></span><button id="next">›</button><span>跳至</span><input id="pageJump" type="number" min="1" value="1" aria-label="目录页码"><button id="jump">查询</button></div></div></section>
<footer class="plan-bar"><div class="plan-title"><b>我的计划</b> <span id="chosenCount"></span></div><div class="plan-chips" id="chips"></div><div class="plan-actions"><button data-panel="plan">查看计划</button><button class="conflicts" data-panel="conflicts" id="conflictCount"></button><button class="primary" disabled>真实选课暂未启用</button></div></footer></main></div>
<div id="scrim" class="scrim" hidden></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden><div class="drawer-header"><h2 id="drawerTitle"></h2><button id="close" aria-label="关闭侧边面板">×</button></div><div class="drawer-content" id="detail"></div></aside>
<script>
// Independent original mockup: no network, backend, accounts or school submissions.
const $=id=>document.getElementById(id),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['英语听力基础','英语阅读实践','摄影基础','西方音乐赏析','艺术与生活','人工智能导论','工程伦理','文学与表达','公共演讲','环境与社会','电影与文化','设计思维','跨文化交流','数据分析入门'];
const courses=names.map((name,i)=>({id:i+1,name,code:'TEST'+String(i+1).padStart(3,'0'),teacher:['测试教师甲','测试教师乙','测试教师丙'][i%3],module:i<2?'国际语言与文化':'通识课程模块',day:i<2?'一': ['二','四','五'][i%3],room:'测试楼'+(101+i),count:20+i,limit:40,restriction:i<2?'测试专业限制':'面向测试年级'}));
let chosen=new Set([1,2]),page=1,pageSize=6,onlyChosen=false,lastFocus=null;
function current(){const query=$('search').value.trim();return courses.filter(c=>(!onlyChosen||chosen.has(c.id))&&[c.name,c.teacher,c.code,c.module,c.restriction].some(v=>v.includes(query)));}
function conflictData(){const matching=[...chosen].filter(i=>i<=2);return {plan:matching.length===2?1:0,existing:matching.length};}
function render(){pageSize=Math.max(1,Math.min(10,Math.floor((document.querySelector(".table-area").clientHeight-40)/96)));const data=current(),pages=Math.max(1,Math.ceil(data.length/pageSize));page=Math.max(1,Math.min(pages,page));const rows=data.slice((page-1)*pageSize,page*pageSize);$('total').textContent=`${courses.length} 个教学班`;
 $('rows').innerHTML=rows.map(c=>`<tr class="${chosen.has(c.id)?'chosen':''}"><td>选课</td><td>待选课</td><td><strong>${safe(c.name)}</strong><small>${c.code} | 测试学院 | 理论课\n2学分 | 32学时 | 公选 | 选修 | 中文授课 | 考试</small></td><td>${c.module}</td><td>${c.code}.01<small>${c.restriction}</small></td><td>${c.teacher}</td><td>测试校区<small>7~14周 星期${c.day} 10~11节 测试校区 ${c.room}${c.id<=2?';\n7~14周 星期三 10~11节 测试校区 '+c.room:''}</small></td><td>${c.count}/${c.limit}<small>剩余 ${c.limit-c.count}</small></td><td><input type="checkbox" data-id="${c.id}" aria-label="预选${c.name}" ${chosen.has(c.id)?'checked':''}></td></tr>`).join('');
 $('range').textContent=`${data.length?((page-1)*pageSize+1):0}–${Math.min(page*pageSize,data.length)} / ${data.length} 个教学班 · 完整教务信息`;$('pageSizeLabel').textContent=`每页 ${pageSize} 条 · 适应窗口`;$('pageLabel').textContent=`${page} / ${pages}`;$('pageJump').value=page;$('pageJump').max=pages;$('prev').disabled=page===1;$('next').disabled=page===pages;
 $('chosenCount').textContent=`${chosen.size}/5门`;$('chips').innerHTML=[...chosen].map(id=>{const c=courses.find(c=>c.id===id);return `<button class="chip" data-panel="plan">${c.name} · ${c.code}.01</button>`;}).join('')||'<span class="subtle">在目录勾选目标课程</span>';
 const conflicts=conflictData();$('conflictCount').textContent=`冲突 ${conflicts.plan+conflicts.existing} 组`;
 $('alertText').textContent=`课表有 3 门课程时间待核实${conflicts.plan+conflicts.existing?` · 计划之间 ${conflicts.plan} 组，与已有课 ${conflicts.existing} 组`:''}`;
 document.querySelectorAll('[data-id]').forEach(input=>input.onchange=()=>{const id=Number(input.dataset.id);if(input.checked&&chosen.size>=5){input.checked=false;openPanel('limit');return;}if(input.checked)chosen.add(id);else chosen.delete(id);render();});
}
const details={
 steps:['七步准备指引','登录教务|已完成|✓;同步已有课表|完整性已核实，3门时间待核实|✓;导入课程目录|14个教学班|✓;选择计划课程|查看当前预选|○;检查时间冲突|请处理重叠与未知时间|!;执行选课|当前真实提交未启用|○;核验并更新课表|执行后显示每门课结果|○'.split(';').map(v=>{const [title,note,icon]=v.split('|');return `<div class="step"><span>${icon}</span><b>${title}</b><p>${note}</p></div>`;}).join('')],
 connect:['连接教务','<p>此页面是独立设计预览，使用示例数据。实际登录和学校会话由现有助手管理。</p><p>连接成功后，常用界面只保留一个简短状态入口；需要人工验证时直接展开此面板。</p>'],
 settings:['执行设置','<p>重试次数、预约开始时间和优先级策略放在这里，主页面仅显示必要操作。</p><label>额外重试次数 <input type="number" value="3" min="0" max="10"></label><p>设计预览不保存到真实计划。</p>'],
 refresh:['同步课程','<p>实际版本同步成功后仅在工具栏更新时间；发生错误时显示需要处理的问题。</p><p>本预览不访问学校或本地服务。</p>'],
 results:['执行结果','<p>执行后显示：成功课程、未成功原因、响应时间、总耗时与课表更新结果。</p><p>详细步骤和日志合并到这里，主界面不会重复放两组监控面板。</p>'],
 timetable:['我的课表','<p>课表独立占满主区域；已有课与预选课使用两种颜色，冲突用醒目的标记。</p><p>此预览只演示导航和面板组织，课表继续使用现有已核验的功能。</p>'],
 about:['关于','<h3>校区25级机械某不知名发烧友 · 界面简化预览</h3><p>本稿为原创布局讨论稿，采用示例课程，未修改现有应用。</p><p>参考：<a href="https://github.com/nusmodifications/nusmods">NUSMods</a> 的课程与课表组织，<a href="https://github.com/RaymondzyLei/class-arrange">class-arrange</a> 的课程筛选与冲突呈现，以及 <a href="https://github.com/shadcn-ui/ui">shadcn/ui</a> 的简洁面板思路。没有复制上述项目代码。</p>'],
 limit:['计划已满','<p>最多预选5门。先移除一个目标再加入新课程。</p>']};
function openPanel(kind){if(kind==='catalog'){closePanel();return;}let [title,body]=details[kind]||['详情',''];if(kind==='plan'){title='我的计划';body=[...chosen].map(id=>{const c=courses.find(c=>c.id===id);return `<div class="detail-card"><b>${c.name} · ${c.code}.01</b><p>${c.teacher} · ${c.restriction}\n第7—14周，周${c.day}第10—11节，测试楼${c.room}${c.id<=2?'\n第7—14周，周三第10—11节，同一教室':''}</p></div>`;}).join('')||'<p>还没有预选课程。</p>';}if(kind==='conflicts'){const c=conflictData();title='冲突与待核实信息';body=`<p>当前${chosen.size}门计划：计划之间${c.plan}组，与已有课${c.existing}组。按课程对计数。</p>${[...chosen].filter(i=>i<=2).map(i=>`<div class="detail-card"><b>[计划与已有课] ${courses[i-1].name} ↔ 已有课程示例</b><p>第7—11周，周一及周三第10—11节。</p></div>`).join('')}${c.plan?'<div class="detail-card"><b>[计划之间] 英语听力基础 ↔ 英语阅读实践</b><p>第7—14周，周一及周三第10—11节。</p></div>':''}<h3>3门已有课时间待核实</h3><p>需要在真实助手中核实完整排课信息，完成前保持提醒。</p>`;}
 lastFocus=document.activeElement;$('drawerTitle').textContent=title;$('detail').innerHTML=body;$('scrim').hidden=false;$('drawer').hidden=false;$('close').focus();}
function closePanel(){$('drawer').hidden=true;$('scrim').hidden=true;lastFocus?.focus();}
document.addEventListener('click',e=>{const button=e.target.closest('[data-panel]');if(button)openPanel(button.dataset.panel);});$('close').onclick=closePanel;$('scrim').onclick=closePanel;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key==='Tab'&&!$('drawer').hidden){const list=[...$('drawer').querySelectorAll('button,input,a')],first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function go(next){page=next;render();document.querySelector('.table-area').scrollTop=0;}$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('jump').onclick=()=>go(Number($('pageJump').value)||1);$('search').oninput=()=>{page=1;render();};$('onlyChosen').onclick=()=>{onlyChosen=!onlyChosen;$('onlyChosen').textContent=onlyChosen?'显示全部':'仅看计划';page=1;render();};$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'☾':'☀';};window.addEventListener('resize',()=>render());render();
</script></body></html>
