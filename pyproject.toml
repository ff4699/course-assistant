[project]
name = "cupk-course-assistant"
version = "0.4.0"
license = "MIT"
description = "Local course planning and session assistant for CUPK"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assistant*", "tools*"]

[tool.setuptools.package-data]
assistant = ["static/*"]

[tool.setuptools.data-files]
"share/cupk-course-assistant" = ["THIRD_PARTY_NOTICES.md"]
"share/cupk-course-assistant/third_party/crawl4ai" = ["third_party/crawl4ai/LICENSE"]
"share/cupk-course-assistant/third_party/playwright" = ["third_party/playwright/LICENSE"]
"share/cupk-course-assistant/third_party/httpx" = ["third_party/httpx/LICENSE.md"]
